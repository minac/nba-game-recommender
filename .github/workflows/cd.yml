name: CD - Deploy to lab

# Triggers a Coolify deploy on the self-hosted lab.
# Lab URL + app identifier kept in repo secrets so this public repo
# doesn't fingerprint the lab in source.
# IaC for the lab lives in a separate private repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to lab
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ secrets.APP_UUID }}
          APP_NAME: ${{ secrets.APP_NAME }}
        run: |
          set -euo pipefail
          for v in COOLIFY_BASE_URL COOLIFY_API_TOKEN APP_UUID APP_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::$v repo secret is not set."
              exit 1
            fi
          done

          echo "🚀 Triggering Coolify deploy for $APP_NAME..."
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_BASE_URL/deploy?uuid=$APP_UUID")

          deployment_uuid=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
          echo "✅ Deployment queued: $deployment_uuid"
