name: CD - Deploy to lab

# Triggers a Coolify deploy on the self-hosted lab (Hetzner CCX13).
# Manifests + IaC for the lab live at github.com/minac/lab.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to lab
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_BASE_URL: https://lab.migueldavid.eu/api/v1
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: dorpfrmsyzl3w1h8h7wpwqiw
          APP_NAME: nba-game-recommender
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN secret is not set on this repo."
            exit 1
          fi

          echo "🚀 Triggering Coolify deploy for $APP_NAME ($APP_UUID)..."
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_BASE_URL/deploy?uuid=$APP_UUID")

          deployment_uuid=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
          echo "✅ Deployment queued: $deployment_uuid"
          echo "  Watch: https://lab.migueldavid.eu/applications/$APP_UUID"
